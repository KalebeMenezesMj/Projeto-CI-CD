name: CI/CD — Flores & Sonhos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: flores-e-sonhos
  PHP_VERSION: "8.2"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. LINT ────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (Laravel Pint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4.2.3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint (dry-run)
        run: ./vendor/bin/pint --test

  # ── 2. VULNERABILITY SCAN (dependências PHP) ──────────────────────────────
  vulnerability-scan:
    name: "Vulnerability Scan (PHP deps)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Audit Composer packages
        run: composer audit --no-dev

  # ── 3. TESTES FUNCIONAIS + COBERTURA ──────────────────────────────────────
  test:
    name: "Tests + Coverage"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP (com Xdebug para cobertura)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, sqlite3, gd, zip, bcmath, intl, exif, pcntl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4.2.3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configure .env for testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Unit tests
        run: ./vendor/bin/phpunit --testsuite Unit --no-coverage

      - name: Run Feature tests with coverage
        run: >
          ./vendor/bin/phpunit
          --testsuite Feature
          --coverage-clover coverage.xml
          --coverage-html coverage-html
          --coverage-text

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── 4. BUILD & PUSH DOCKER ────────────────────────────────────────────────
  docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [test, vulnerability-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # ── 5. DEPLOY NO SERVIDOR ─────────────────────────────────────────────────
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy no servidor
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          IMAGE: "${{ secrets.DOCKERHUB_USERNAME }}/flores-e-sonhos:latest"
          APP_KEY: "${{ secrets.APP_KEY }}"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          {
            echo 'set -e'
            echo "docker pull '$IMAGE'"
            echo 'docker stop flores-e-sonhos 2>/dev/null || true'
            echo 'docker rm   flores-e-sonhos 2>/dev/null || true'
            echo 'sudo mkdir -p /opt/flores-e-sonhos/storage/framework/sessions /opt/flores-e-sonhos/storage/framework/views /opt/flores-e-sonhos/storage/framework/cache/data /opt/flores-e-sonhos/storage/logs /opt/flores-e-sonhos/storage/app/public /opt/flores-e-sonhos/database'
            echo 'sudo chown -R ubuntu:ubuntu /opt/flores-e-sonhos'
            echo "docker run -d --name flores-e-sonhos --restart unless-stopped -p 80:80 -e APP_ENV=production -e APP_DEBUG=false -e 'APP_KEY=$APP_KEY' -e DB_CONNECTION=sqlite -e DB_DATABASE=/var/www/html/database/database.sqlite -v /opt/flores-e-sonhos/storage:/var/www/html/storage -v /opt/flores-e-sonhos/database:/var/www/html/database '$IMAGE'"
            echo 'docker image prune -f'
            echo 'echo Deploy concluido'
          } > /tmp/deploy.sh

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@52.67.114.118 bash < /tmp/deploy.sh
